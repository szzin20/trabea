spring.application.name=trabea

#Data Source
spring.datasource.url=jdbc:postgresql://localhost:5432/trabea
spring.datasource.username=postgres
spring.datasource.password=indocyber

#Driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Keep users and role mappings between restarts.
spring.jpa.hibernate.ddl-auto=create-drop

# Optional first-admin bootstrap credentials. Set these in the process environment.
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:43200000}

# Debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.root=INFO
logging.level.com.exacc.adnotatio=DEBUG
